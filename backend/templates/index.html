<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<h1>Company Inventory</h1>
<a href="/logout">Logout</a>

<form method="POST" action="/add-product" enctype="multipart/form-data" class="card">
    <h3>Add Product</h3>
    <input name="name" placeholder="Name" required>
    <input name="price" placeholder="Price" required>
    <input name="stock" placeholder="Stock" required>
    <input type="file" name="image" required>
    <button>Add</button>
</form>

<div class="grid">
{% for p in products %}
<div class="product">
    {% if p.image %}
    <img src="{{ url_for('static', filename='images/uploads/' + p.image) }}">
    {% endif %}
    <h3>{{ p.name }}</h3>
    <p>Price: ${{ p.price }}</p>
    <p>Stock: {{ p.stock }}</p>
    <a href="/edit/{{ p.product_id }}">Edit</a>
</div>
{% endfor %}
</div>
</body>
</html>
